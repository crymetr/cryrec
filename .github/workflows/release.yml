name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path cryrec.pyw -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} != VERSION $v" }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build exe, portable zip and installer
        shell: pwsh
        run: ./packaging/build.ps1

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CryRec-*-setup.exe
            dist/CryRec-*-portable.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CryRec-build
          path: |
            dist/CryRec-*-setup.exe
            dist/CryRec-*-portable.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build signed APK
        env:
          CRYREC_KEYSTORE_B64: ${{ secrets.CRYREC_KEYSTORE_B64 }}
          CRYREC_KEYSTORE_PASSWORD: ${{ secrets.CRYREC_KEYSTORE_PASSWORD }}
          CRYREC_KEY_ALIAS: ${{ secrets.CRYREC_KEY_ALIAS }}
        run: |
          echo "$CRYREC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export CRYREC_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' ../cryrec.pyw)
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/CryRec-$v-android.apk"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CryRec-*-android.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CryRec-android
          path: dist/CryRec-*-android.apk
